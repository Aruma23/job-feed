name: Scrape jobs

on:
  schedule:
    - cron: "41 10,16 * * *"   # about 6:41am and 12:41pm New York time (UTC clock)
  workflow_dispatch:            # adds a "Run workflow" button

permissions:
  contents: write               # lets the run save jobs.csv back to this repository

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-jobspy==1.4.1
      - run: python scrape.py
      - name: Save jobs.csv
        run: |
          git config user.name "job-feed"
          git config user.email "job-feed@users.noreply.github.com"
          git add jobs.csv || true
          git commit -m "Update jobs" || echo "No changes"
          git push
