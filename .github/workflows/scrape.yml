"""Job feed for Gabriel's Job Search Tracker.

Runs on GitHub Actions twice a day. Searches Indeed and LinkedIn's public job listings
for NYC finance and planning roles and saves them to jobs.csv. It never signs in to any
account, so there is no account that could be restricted. The job finder in the Google
Sheet reads jobs.csv, filters it with the same rules as the company boards, and adds
new matches to Leads.
"""
import csv
import math
import random
import sys
import time
from datetime import date
from jobspy import scrape_jobs

LOCATION = "New York, NY"
DISTANCE_MILES = 30          # covers Jersey City, Hoboken and Stamford
HOURS_OLD = 72               # only postings from the last 3 days (the best odds)
SEARCHES = [                 # (site, search). Indeed has no practical limit; LinkedIn blocks after ~10 pages per run.
    ("indeed", "FP&A analyst"),
    ("indeed", "financial planning and analysis"),
    ("indeed", "financial analyst"),
    ("indeed", "strategic finance"),
    ("indeed", "workforce planning analyst"),
    ("indeed", "business planning analyst"),
    ("linkedin", "FP&A analyst"),
    ("linkedin", "financial analyst"),
    ("linkedin", "strategic finance"),
]
RESULTS = {"indeed": 60, "linkedin": 25}
COLS = ["id", "site", "title", "company", "location", "is_remote", "date_posted",
        "job_url", "job_url_direct", "min_amount", "max_amount", "interval", "description"]


def clean(value):
    """Turns pandas blanks into empty text and keeps every value on one line."""
    if value is None or (isinstance(value, float) and math.isnan(value)):
        return ""
    if isinstance(value, date):
        return value.isoformat()
    if isinstance(value, float) and value.is_integer():
        return str(int(value))
    return str(value).replace("\r", "").replace("\n", "\\n")


def main():
    rows, seen = [], set()
    for site, term in SEARCHES:
        try:
            df = scrape_jobs(site_name=[site], search_term=term, location=LOCATION,
                             distance=DISTANCE_MILES, results_wanted=RESULTS[site],
                             hours_old=HOURS_OLD, country_indeed="USA",
                             description_format="markdown", verbose=0)
        except Exception as exc:  # one blocked search should not stop the others
            print(f"{site} / {term}: skipped ({exc})", file=sys.stderr)
            continue
        added = 0
        for rec in df.to_dict("records"):
            url = rec.get("job_url")
            if not url or url in seen:
                continue
            seen.add(url)
            row = {c: clean(rec.get(c)) for c in COLS}
            row["description"] = row["description"][:8000]
            rows.append(row)
            added += 1
        print(f"{site} / {term}: {added} new")
        time.sleep(random.uniform(5, 10))   # spaced out like a person browsing

    if not rows:
        print("Nothing came back this run; keeping the previous jobs.csv.")
        return
    with open("jobs.csv", "w", newline="", encoding="utf-8") as f:
        writer = csv.DictWriter(f, fieldnames=COLS)
        writer.writeheader()
        writer.writerows(rows)
    print(f"Saved {len(rows)} jobs to jobs.csv")


if __name__ == "__main__":
    main()
