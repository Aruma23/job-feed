name: Scrape jobs

on:
  schedule:
    - cron: "41 11,15,19,23 * * *"   # about 6:41am, 10:41am, 2:41pm, 6:41pm New York time (EST)
  workflow_dispatch:                  # "Run workflow" button

permissions: {}                       # nothing by default; each job asks only for what it needs

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  collect:                            # runs third-party code (JobSpy), so it can read the repo but never write to it
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes --no-deps -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python scrape.py
      - name: Check the output before handing it on
        run: |
          python - <<'EOF'
          import csv, json, sys
          csv.field_size_limit(10**8)
          rows = list(csv.DictReader(open("jobs.csv", encoding="utf-8")))
          need = {"id", "site", "title", "company", "job_url"}
          assert need <= set(rows[0].keys() if rows else need), "jobs.csv lost a required column"
          assert all(r["job_url"].startswith("http") for r in rows), "a row without a web link"
          assert len({r["id"] for r in rows}) == len(rows), "two rows share an id (CONTRACT.md invariant 1)"
          enums = {"freshness": {"fresh", "active", "aging", "stale", "gone"}, "ghost_risk": {"low", "medium", "high"},
                   "trust": {"verified", "consistent", "unverified", "suspicious"}, "priority": {"A", "B", "C", "D"},
                   "level_fit": {"in_range", "stretch", "out_of_range"}, "poster": {"employer", "recruiter", "recruiter_unnamed"}}
          bad = [(r["id"], c, r.get(c)) for r in rows for c, ok in enums.items() if r.get(c) not in ok]
          assert not bad, f"values outside CONTRACT.md: {bad[:5]}"
          s = json.load(open("feed_status.json"))
          a = s.get("audit") or {}
          print(json.dumps({"audit": a.get("level"), "restored": a.get("restored"), "findings": [i["level"] + ": " + i["title"] for i in a.get("items", [])]}))
          print(json.dumps({"intel": [e["employer"] + ": " + "; ".join(e["signals"][:2]) for e in (s.get("intel") or {}).get("top", [])[:6]]}))
          print(json.dumps({"contract": s.get("contract"), "coverage": (s.get("coverage") or {}).get("uncovered_hosts", [])[:6]}))
          print(json.dumps({k: (s.get("direct") or {}).get(k) for k in ("drops", "drops_sample", "adapters_degraded", "routes_gone", "employers_checked", "employers_verified", "verify_error", "aggregator_rows_folded", "kept_not_due", "footprint", "sources")}))
          print(json.dumps({k: s[k] for k in ("partial", "failed", "rows_written", "empty_sites")}))
          d = s.get("direct") or {}
          print(json.dumps({k: d.get(k) for k in ("boards_total", "boards_ok", "boards_failed", "boards_new", "rows_direct", "pct_direct", "unconventional", "held_for_review", "harvest_blocks", "harvest_new", "harvest_progress", "harvest_error", "verified", "verified_by_status", "registry_size", "registry_waiting", "closed_confirmed", "still_open", "error")}))
          print(json.dumps({"history": s.get("history"), "requests": d.get("requests")}))
          print(json.dumps({"regions": s.get("regions"), "relevance": s.get("relevance")}))
          print(json.dumps({k: v for k, v in (s.get("scheduler") or {}).get("decisions", {}).items() if v not in ("active", "trial")}))
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: feed
          path: |
            jobs.csv
            feed_status.json
            boards.json
            search_stats.json
            review.json
            registry.tsv
            harvest_state.json
            history.json
            AUDIT.md
            employers.json
            audit_log.json
            sources.json
          retention-days: 3

  classify:                           # our own code only (no third-party packages); reads the feed as data, may call Gemini
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: feed
          path: in                    # data from the collect job stays out of the code directory
      - name: Review borderline jobs (relevance stage 2)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # only this job sees it; without it the rules' verdicts stand
        run: python relevance.py in classify_cache.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: classified
          path: |
            in/jobs.csv
            in/feed_status.json
            in/classify_cache.json
          if-no-files-found: ignore
          retention-days: 3

  publish:                            # only job that can write; runs no third-party Python
    needs: [collect, classify]
    if: ${{ always() && needs.collect.result == 'success' }}   # a failed review step never holds back the feed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: main                   # the latest main, not the commit the run started on (code may have moved since)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: feed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        continue-on-error: true
        with:
          name: classified            # the reviewed feed replaces the collected one when the review step ran
      - name: Save jobs.csv and feed_status.json
        run: |
          git config user.name "job-feed"
          git config user.email "job-feed@users.noreply.github.com"
          test -f boards.json && python3 -c "import json; d=json.load(open('boards.json')); assert isinstance(d.get('boards'), dict)" && git add boards.json
          test -f search_stats.json && python3 -c "import json; d=json.load(open('search_stats.json')); assert isinstance(d.get('searches'), dict)" && git add search_stats.json
          test -f classify_cache.json && python3 -c "import json; d=json.load(open('classify_cache.json')); assert isinstance(d.get('jobs'), dict)" && git add classify_cache.json
          test -f history.json && python3 -c "import json; d=json.load(open('history.json')); assert isinstance(d.get('jobs'), dict)" && git add history.json
          test -f harvest_state.json && python3 -c "import json; d=json.load(open('harvest_state.json')); assert isinstance(d.get('done'), dict)" && git add harvest_state.json
          test -f registry.tsv && head -1 registry.tsv | grep -q "^board" && git add registry.tsv
          test -f employers.json && python3 -c "import json; d=json.load(open('employers.json')); assert isinstance(d.get('employers'), list)" && git add employers.json
          test -f audit_log.json && python3 -c "import json; assert isinstance(json.load(open('audit_log.json')), list)" && git add audit_log.json
          test -f AUDIT.md && head -1 AUDIT.md | grep -q "^# Feed audit" && git add AUDIT.md
          test -f sources.json && python3 -c "import json; assert isinstance(json.load(open('sources.json')).get('employers'), dict)" && git add sources.json
          git add jobs.csv feed_status.json
          git commit -m "Update jobs" || echo "No changes"
          for i in 1 2 3; do git push && exit 0; sleep 5; git pull --rebase origin main || exit 1; done
          exit 1
